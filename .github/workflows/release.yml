      #       jq -r '.[] | select(.type == "Docker Image") | .name | select(startswith("ghcr.io/") and endswith("-amd64"))' /tmp/goreleaser-artifacts.json
      #     )
      #
      #     for src in "${src_images[@]}"; do
      #       tag_and_push "$src"
      #     done
      #
      #     {
      #       echo "images_markdown<<EOF"
